<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Freeze Test</title>
  <style>
    body { background: #111; color: #eee; font-family: monospace; padding: 20px; }
    canvas { border: 1px solid #444; }
    #controls { margin-top: 10px; }
    input { font-size: 16px; width: 50px; text-transform: uppercase; }
    button { font-size: 16px; padding: 8px 20px; margin-left: 8px; }
    table { border-collapse: collapse; font-size: 15px; margin-top: 14px; }
    td, th { padding: 5px 16px; text-align: left; border: 1px solid #333; }
    th { color: #888; }
    .win { color: #4ade80; }
    .lose { color: #888; }
    #tally { font-size: 18px; margin-top: 16px; }
    textarea { width: 640px; height: 90px; background: #000; color: #6f6;
               font-family: monospace; font-size: 11px; margin-top: 12px; }
  </style>
</head>
<body>
  <h3>Freeze Test - press SPACE to capture</h3>
  <video id="video" style="display:none" playsinline></video>
  <canvas id="canvas" width="640" height="480"></canvas>
  <div id="controls">
    letter: <input id="letter" maxlength="1" value="A">
    <button id="shoot">Capture (space)</button>
    <button id="reset">Reset table</button>
    <button id="copy">Copy numbers</button>
  </div>
  <div id="table"></div>
  <div id="tally"></div>
  <textarea id="dump" readonly></textarea>

<script type="module">
import { FilesetResolver, HandLandmarker }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const letterInput = document.getElementById("letter");
const tableDiv = document.getElementById("table");
const tallyDiv = document.getElementById("tally");
const dump = document.getElementById("dump");

function normalizeLandmarks(row) {
  const points = [];
  for (let i = 0; i < row.length; i += 3) {
    points.push([row[i], row[i + 1], row[i + 2]]);
  }

  const wx = points[0][0];
  const wy = points[0][1];
  const wz = points[0][2];

  for (const p of points) {
    p[0] -= wx;
    p[1] -= wy;
    p[2] -= wz;
  }

  let maxDist = 0;
  for (const p of points) {
    const d = Math.sqrt(p[0] * p[0] + p[1] * p[1] + p[2] * p[2]);
    if (d > maxDist) maxDist = d;
  }

  const out = [];
  for (const p of points) {
    if (maxDist > 0) {
      out.push(p[0] / maxDist, p[1] / maxDist, p[2] / maxDist);
    } else {
      out.push(p[0], p[1], p[2]);
    }
  }

  return out;
}

function flipX(features) {
  const out = features.slice();
  for (let i = 0; i < out.length; i += 3) {
    out[i] = -out[i];
  }
  return out;
}

function walkTree(tree, x) {
  let node = 0;
  while (tree.f[node] !== -1) {
    if (x[tree.f[node]] <= tree.t[node]) {
      node = tree.l[node];
    } else {
      node = tree.r[node];
    }
  }
  return tree.v[node];
}

function predictProba(forest, x) {
  const votes = new Array(forest.classes.length).fill(0);
  for (const tree of forest.trees) {
    votes[walkTree(tree, x)] += 1;
  }
  return votes.map(v => v / forest.trees.length);
}

function best(forest, probs) {
  let b = 0;
  for (let i = 1; i < probs.length; i++) {
    if (probs[i] > probs[b]) b = i;
  }
  return [forest.classes[b], probs[b]];
}

const forest = await (await fetch("model.json")).json();

const vision = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm"
);

const handLandmarker = await HandLandmarker.createFromOptions(vision, {
  baseOptions: {
    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
  },
  runningMode: "VIDEO",
  numHands: 1,
  minHandDetectionConfidence: 0.7,
  minTrackingConfidence: 0.5
});

const stream = await navigator.mediaDevices.getUserMedia({
  video: { width: 640, height: 480 }
});
video.srcObject = stream;
await video.play();

let lastLandmarks = null;
let rows = [];
let asIsCorrect = 0;
let flippedCorrect = 0;

function loop() {
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const result = handLandmarker.detectForVideo(canvas, performance.now());

  if (result.landmarks.length > 0) {
    lastLandmarks = result.landmarks[0];
    ctx.fillStyle = "red";
    for (const lm of lastLandmarks) {
      ctx.beginPath();
      ctx.arc(lm.x * canvas.width, lm.y * canvas.height, 4, 0, 6.29);
      ctx.fill();
    }
  } else {
    lastLandmarks = null;
    ctx.fillStyle = "red";
    ctx.font = "24px monospace";
    ctx.fillText("no hand", 20, 40);
  }

  requestAnimationFrame(loop);
}

function render() {
  tableDiv.innerHTML =
    `<table><tr><th>letter</th><th>as-is</th><th>x-flipped</th></tr>` +
    rows.join("") + `</table>`;

  tallyDiv.innerHTML =
    `as-is correct: ${asIsCorrect}   |   ` +
    `x-flipped correct: ${flippedCorrect}   |   captures: ${rows.length}`;
}

function capture() {
  const letter = letterInput.value.trim().toUpperCase();
  if (!letter || !lastLandmarks) return;

  const row = [];
  for (const lm of lastLandmarks) {
    row.push(lm.x, lm.y, lm.z);
  }

  const features = normalizeLandmarks(row);

  const a = best(forest, predictProba(forest, features));
  const f = best(forest, predictProba(forest, flipX(features)));

  const aOk = a[0] === letter;
  const fOk = f[0] === letter;

  if (aOk) asIsCorrect++;
  if (fOk) flippedCorrect++;

  rows.push(
    `<tr><td>${letter}</td>` +
    `<td class="${aOk ? "win" : "lose"}">${a[0]} ${(a[1] * 100).toFixed(0)}%</td>` +
    `<td class="${fOk ? "win" : "lose"}">${f[0]} ${(f[1] * 100).toFixed(0)}%</td>` +
    `</tr>`
  );

  dump.value =
    `letter=${letter} js_as_is=${a[0]} ${(a[1] * 100).toFixed(0)}%\n` +
    `RAW ${row.map(v => v.toFixed(6)).join(",")}\n` +
    `NORM ${features.map(v => v.toFixed(6)).join(",")}`;

  render();
}

document.getElementById("shoot").onclick = capture;

document.getElementById("reset").onclick = () => {
  rows = [];
  asIsCorrect = 0;
  flippedCorrect = 0;
  render();
};

document.getElementById("copy").onclick = () => {
  dump.select();
  document.execCommand("copy");
};

window.addEventListener("keydown", (e) => {
  if (e.code === "Space" && document.activeElement !== letterInput) {
    e.preventDefault();
    capture();
  }
});

render();
loop();

</script>
</body>
</html>
