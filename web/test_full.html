<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Full Pipeline</title>
  <style>
    body { background: #111; color: #eee; font-family: monospace; padding: 20px; }
    canvas { border: 1px solid #444; }
    #sentence { font-size: 30px; margin-top: 12px; min-height: 42px;
                letter-spacing: 4px; }
    #keys { color: #888; font-size: 14px; margin-top: 8px; }
    button { font-size: 15px; padding: 6px 16px; margin-right: 8px; }
  </style>
</head>
<body>
  <h3>Full Pipeline - threshold + smoothing + hold</h3>
  <video id="video" style="display:none" playsinline></video>
  <canvas id="canvas" width="640" height="480"></canvas>
  <div id="sentence"></div>
  <div>
    <button id="space">space</button>
    <button id="back">delete</button>
    <button id="clear">clear</button>
    <button id="mirror">mirror: off</button>
  </div>
  <div id="keys">keys: [space] space  [backspace] delete  [c] clear  [m] mirror</div>

<script type="module">
import { FilesetResolver, HandLandmarker }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";

const CONFIDENCE_THRESHOLD = 0.60;
const SMOOTHING_WINDOW = 7;
const HOLD_FRAMES = 15;

const GREEN = "#4ade80";
const RED = "#f87171";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const sentenceDiv = document.getElementById("sentence");
const mirrorBtn = document.getElementById("mirror");

function normalizeLandmarks(row) {
  const points = [];
  for (let i = 0; i < row.length; i += 3) {
    points.push([row[i], row[i + 1], row[i + 2]]);
  }

  const wx = points[0][0];
  const wy = points[0][1];
  const wz = points[0][2];

  for (const p of points) {
    p[0] -= wx;
    p[1] -= wy;
    p[2] -= wz;
  }

  let maxDist = 0;
  for (const p of points) {
    const d = Math.sqrt(p[0] * p[0] + p[1] * p[1] + p[2] * p[2]);
    if (d > maxDist) maxDist = d;
  }

  const out = [];
  for (const p of points) {
    if (maxDist > 0) {
      out.push(p[0] / maxDist, p[1] / maxDist, p[2] / maxDist);
    } else {
      out.push(p[0], p[1], p[2]);
    }
  }

  return out;
}

function walkTree(tree, x) {
  let node = 0;
  while (tree.f[node] !== -1) {
    if (x[tree.f[node]] <= tree.t[node]) {
      node = tree.l[node];
    } else {
      node = tree.r[node];
    }
  }
  return tree.v[node];
}

function predictProba(forest, x) {
  const votes = new Array(forest.classes.length).fill(0);
  for (const tree of forest.trees) {
    votes[walkTree(tree, x)] += 1;
  }
  return votes.map(v => v / forest.trees.length);
}

function mostCommon(history) {
  const counts = new Map();
  for (const item of history) {
    counts.set(item, (counts.get(item) || 0) + 1);
  }

  let winner = null;
  let bestCount = -1;
  for (const [key, count] of counts) {
    if (count > bestCount) {
      bestCount = count;
      winner = key;
    }
  }
  return winner;
}

const forest = await (await fetch("model.json")).json();

const vision = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm"
);

const handLandmarker = await HandLandmarker.createFromOptions(vision, {
  baseOptions: {
    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
  },
  runningMode: "VIDEO",
  numHands: 1,
  minHandDetectionConfidence: 0.7,
  minTrackingConfidence: 0.5
});

const stream = await navigator.mediaDevices.getUserMedia({
  video: { width: 640, height: 480 }
});
video.srcObject = stream;
await video.play();

let history = [];
let sentence = "";
let holdLetter = null;
let holdCount = 0;
let committed = false;
let mirror = false;

function render() {
  sentenceDiv.textContent = sentence.slice(-20);
}

function loop() {
  if (mirror) {
    ctx.save();
    ctx.scale(-1, 1);
    ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
    ctx.restore();
  } else {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  }

  const result = handLandmarker.detectForVideo(canvas, performance.now());

  if (result.landmarks.length > 0) {
    const landmarks = result.landmarks[0];

    ctx.fillStyle = "red";
    for (const lm of landmarks) {
      ctx.beginPath();
      ctx.arc(lm.x * canvas.width, lm.y * canvas.height, 4, 0, 6.29);
      ctx.fill();
    }

    const row = [];
    for (const lm of landmarks) {
      row.push(lm.x, lm.y, lm.z);
    }

    const probs = predictProba(forest, normalizeLandmarks(row));

    let bestIndex = 0;
    for (let i = 1; i < probs.length; i++) {
      if (probs[i] > probs[bestIndex]) bestIndex = i;
    }

    const prediction = forest.classes[bestIndex];
    const confidence = probs[bestIndex];

    history.push(confidence >= CONFIDENCE_THRESHOLD ? prediction : null);
    if (history.length > SMOOTHING_WINDOW) {
      history.shift();
    }

    const stableLetter = mostCommon(history);

    if (stableLetter === holdLetter) {
      holdCount += 1;
    } else {
      holdLetter = stableLetter;
      holdCount = 1;
      committed = false;
    }

    if (stableLetter !== null && !committed && holdCount >= HOLD_FRAMES) {
      sentence += stableLetter;
      committed = true;
      render();
    }

    const color = stableLetter !== null ? GREEN : RED;
    const shown = stableLetter !== null ? stableLetter : "?";

    ctx.fillStyle = color;
    ctx.font = "90px monospace";
    ctx.fillText(shown, 250, 120);
    ctx.font = "24px monospace";
    ctx.fillText(`${(confidence * 100).toFixed(0)}%`, 250, 165);

    if (stableLetter !== null) {
      const progress = Math.min(holdCount / HOLD_FRAMES, 1);
      ctx.strokeStyle = color;
      ctx.strokeRect(250, 195, 150, 14);
      ctx.fillRect(250, 195, 150 * progress, 14);
    }
  } else {
    history = [];
    holdLetter = null;
    holdCount = 0;
    committed = false;

    ctx.fillStyle = RED;
    ctx.font = "24px monospace";
    ctx.fillText("no hand", 20, 40);
  }

  requestAnimationFrame(loop);
}

document.getElementById("space").onclick = () => {
  sentence += " ";
  render();
};

document.getElementById("back").onclick = () => {
  sentence = sentence.slice(0, -1);
  render();
};

document.getElementById("clear").onclick = () => {
  sentence = "";
  render();
};

mirrorBtn.onclick = () => {
  mirror = !mirror;
  mirrorBtn.textContent = `mirror: ${mirror ? "on" : "off"}`;
};

window.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    sentence += " ";
    render();
  } else if (e.code === "Backspace") {
    e.preventDefault();
    sentence = sentence.slice(0, -1);
    render();
  } else if (e.key === "c" || e.key === "C") {
    sentence = "";
    render();
  } else if (e.key === "m" || e.key === "M") {
    mirror = !mirror;
    mirrorBtn.textContent = `mirror: ${mirror ? "on" : "off"}`;
  }
});

render();
loop();

</script>
</body>
</html>
