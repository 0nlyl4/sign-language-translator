<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mirror Diagnostic</title>
  <style>
    body { background: #111; color: #eee; font-family: monospace; padding: 20px; }
    canvas { border: 1px solid #444; }
    table { margin-top: 12px; border-collapse: collapse; font-size: 16px; }
    td, th { padding: 6px 18px; text-align: left; border: 1px solid #333; }
    th { color: #888; }
    .win { color: #4ade80; }
  </style>
</head>
<body>
  <h3>Mirror Diagnostic - both directions from the same frame</h3>
  <video id="video" style="display:none" playsinline></video>
  <canvas id="canvas" width="640" height="480"></canvas>
  <div id="info">loading...</div>

<script type="module">
import { FilesetResolver, HandLandmarker }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");

let mirror = false;

window.addEventListener("keydown", (e) => {
  if (e.key === "m" || e.key === "M") {
    mirror = !mirror;
  }
});

function normalizeLandmarks(row) {
  const points = [];
  for (let i = 0; i < row.length; i += 3) {
    points.push([row[i], row[i + 1], row[i + 2]]);
  }

  const wx = points[0][0];
  const wy = points[0][1];
  const wz = points[0][2];

  for (const p of points) {
    p[0] -= wx;
    p[1] -= wy;
    p[2] -= wz;
  }

  let maxDist = 0;
  for (const p of points) {
    const d = Math.sqrt(p[0] * p[0] + p[1] * p[1] + p[2] * p[2]);
    if (d > maxDist) maxDist = d;
  }

  const out = [];
  for (const p of points) {
    if (maxDist > 0) {
      out.push(p[0] / maxDist, p[1] / maxDist, p[2] / maxDist);
    } else {
      out.push(p[0], p[1], p[2]);
    }
  }

  return out;
}

function flipX(features) {
  const out = features.slice();
  for (let i = 0; i < out.length; i += 3) {
    out[i] = -out[i];
  }
  return out;
}

function walkTree(tree, x) {
  let node = 0;
  while (tree.f[node] !== -1) {
    if (x[tree.f[node]] <= tree.t[node]) {
      node = tree.l[node];
    } else {
      node = tree.r[node];
    }
  }
  return tree.v[node];
}

function predictProba(forest, x) {
  const votes = new Array(forest.classes.length).fill(0);
  for (const tree of forest.trees) {
    votes[walkTree(tree, x)] += 1;
  }
  return votes.map(v => v / forest.trees.length);
}

function topThree(forest, probs) {
  return probs
    .map((p, i) => [forest.classes[i], p])
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3);
}

function cell(ranked) {
  return ranked
    .map(r => `${r[0]} ${(r[1] * 100).toFixed(0)}%`)
    .join("   ");
}

const forest = await (await fetch("model.json")).json();

const vision = await FilesetResolver.forVisionTasks(
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm"
);

const handLandmarker = await HandLandmarker.createFromOptions(vision, {
  baseOptions: {
    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
  },
  runningMode: "VIDEO",
  numHands: 1,
  minHandDetectionConfidence: 0.7,
  minTrackingConfidence: 0.5
});

const stream = await navigator.mediaDevices.getUserMedia({
  video: { width: 640, height: 480 }
});
video.srcObject = stream;
await video.play();

function loop() {
  if (mirror) {
    ctx.save();
    ctx.scale(-1, 1);
    ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
    ctx.restore();
  } else {
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  }

  const result = handLandmarker.detectForVideo(canvas, performance.now());

  if (result.landmarks.length > 0) {
    const landmarks = result.landmarks[0];

    ctx.fillStyle = "red";
    for (const lm of landmarks) {
      ctx.beginPath();
      ctx.arc(lm.x * canvas.width, lm.y * canvas.height, 4, 0, 6.29);
      ctx.fill();
    }

    const row = [];
    for (const lm of landmarks) {
      row.push(lm.x, lm.y, lm.z);
    }

    const features = normalizeLandmarks(row);

    const asIs = topThree(forest, predictProba(forest, features));
    const flipped = topThree(forest, predictProba(forest, flipX(features)));

    const asIsWins = asIs[0][1] >= flipped[0][1];
    const winner = asIsWins ? asIs[0] : flipped[0];
    const tag = asIsWins ? "as-is" : "flipped";

    ctx.fillStyle = "lime";
    ctx.font = "80px monospace";
    ctx.fillText(winner[0], 250, 120);
    ctx.font = "20px monospace";
    ctx.fillText(tag, 250, 155);

    info.innerHTML =
      `<div>draw mirror: ${mirror ? "ON" : "OFF"}   (press M)</div>` +
      `<table>` +
      `<tr><th>direction</th><th>top 3</th></tr>` +
      `<tr class="${asIsWins ? "win" : ""}">` +
      `<td>as-is</td><td>${cell(asIs)}</td></tr>` +
      `<tr class="${asIsWins ? "" : "win"}">` +
      `<td>x-flipped</td><td>${cell(flipped)}</td></tr>` +
      `</table>`;
  } else {
    info.innerHTML = "no hand";
  }

  requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
